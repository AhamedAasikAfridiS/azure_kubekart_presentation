<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 40px "Segoe UI",sans-serif;fill:#0a1a2f}
      .sub{font:400 18px "Segoe UI",sans-serif;fill:#64748b}
      .h{font:700 19px "Segoe UI",sans-serif;fill:#0f172a}
      .t{font:400 14px "Segoe UI",sans-serif;fill:#475569}
      .l{font:600 13px "Segoe UI",sans-serif;fill:#475569}
      .line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect width="1600" height="10" fill="#0078d4"/>
  <text x="60" y="70" class="title">KubeCart High-Level Application Architecture</text>
  <text x="62" y="104" class="sub">React frontend, HTTP REST API, managed Azure services, and asynchronous notifications</text>

  <g filter="url(#s)">
    <rect x="55" y="260" width="190" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="150" y="302" text-anchor="middle" class="h">Customer / Admin</text>
    <text x="150" y="332" text-anchor="middle" class="t">Web browser</text>
  </g>
  <g filter="url(#s)">
    <rect x="55" y="500" width="190" height="110" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="150" y="542" text-anchor="middle" class="h">Microsoft Entra ID</text>
    <text x="150" y="572" text-anchor="middle" class="t">Authentication &amp; IAM</text>
  </g>

  <rect x="335" y="185" width="470" height="485" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text x="365" y="228" class="h">Azure App Service</text>
  <text x="365" y="253" class="t">KubeCart monolithic web application</text>
  <g filter="url(#s)">
    <rect x="385" y="300" width="370" height="110" rx="16" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="570" y="346" text-anchor="middle" class="h">React Frontend</text>
    <text x="570" y="378" text-anchor="middle" class="t">Products, cart, orders and profile</text>
  </g>
  <g filter="url(#s)">
    <rect x="385" y="490" width="370" height="120" rx="16" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="570" y="534" text-anchor="middle" class="h">Node.js / Express Backend</text>
    <text x="570" y="568" text-anchor="middle" class="l">HTTP REST API</text>
    <text x="570" y="594" text-anchor="middle" class="t">JSON endpoints under /api/*</text>
  </g>

  <g filter="url(#s)">
    <rect x="930" y="145" width="270" height="100" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1065" y="187" text-anchor="middle" class="h">Azure Key Vault</text>
    <text x="1065" y="217" text-anchor="middle" class="t">Application secrets</text>
  </g>
  <g filter="url(#s)">
    <rect x="930" y="285" width="270" height="100" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="1065" y="327" text-anchor="middle" class="h">Azure Blob Storage</text>
    <text x="1065" y="357" text-anchor="middle" class="t">Images and files</text>
  </g>
  <g filter="url(#s)">
    <rect x="930" y="425" width="270" height="105" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="1065" y="467" text-anchor="middle" class="h">Azure Cosmos DB</text>
    <text x="1065" y="497" text-anchor="middle" class="t">API for MongoDB</text>
  </g>
  <g filter="url(#s)">
    <rect x="930" y="570" width="270" height="105" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="1065" y="612" text-anchor="middle" class="h">Azure Service Bus</text>
    <text x="1065" y="642" text-anchor="middle" class="t">Notification queue</text>
  </g>
  <g filter="url(#s)">
    <rect x="1300" y="480" width="245" height="105" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="1422" y="522" text-anchor="middle" class="h">Azure Function</text>
    <text x="1422" y="552" text-anchor="middle" class="t">Notification processor</text>
  </g>
  <g filter="url(#s)">
    <rect x="1300" y="660" width="245" height="90" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="1422" y="700" text-anchor="middle" class="h">Email Service</text>
    <text x="1422" y="728" text-anchor="middle" class="t">Customer notifications</text>
  </g>

  <path d="M245 310H385" class="line"/>
  <text x="285" y="294" class="l">HTTPS</text>
  <path d="M150 500V360" class="line"/>
  <text x="166" y="435" class="l">Sign in</text>
  <path d="M245 555C300 555 300 255 335 255" class="line"/>
  <text x="260" y="460" class="l">Authenticated session</text>
  <path d="M570 410V490" class="line"/>
  <rect x="463" y="430" width="214" height="42" rx="8" fill="#fff"/>
  <text x="570" y="448" text-anchor="middle" class="l">HTTPS REST API</text>
  <text x="570" y="466" text-anchor="middle" class="t">JSON /api/*</text>

  <path d="M755 525C835 525 840 195 930 195" class="line"/>
  <text x="815" y="320" class="l">Read secrets</text>
  <path d="M755 545C840 545 840 335 930 335" class="line"/>
  <text x="820" y="408" class="l">Files</text>
  <path d="M755 565C840 565 850 477 930 477" class="line"/>
  <text x="817" y="521" class="l">Data</text>
  <path d="M755 585C840 585 850 622 930 622" class="line"/>
  <text x="790" y="625" class="l">Publish notification</text>
  <path d="M1200 622C1250 622 1250 532 1300 532" class="line"/>
  <text x="1220" y="572" class="l">Queue trigger</text>
  <path d="M1422 585V660" class="line"/>
  <text x="1438" y="625" class="l">Send email</text>

  <rect x="55" y="815" width="1490" height="50" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="800" y="847" text-anchor="middle" class="l">The React frontend communicates with the Express backend using an HTTPS REST API with JSON requests and responses.</text>
</svg>
